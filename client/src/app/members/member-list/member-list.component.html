<div class="row mt-4">
    <div class="text-center mt-3">
        <h3>Your Matches - {{memberservice.paginationResult()?.pagination?.totalItems}}</h3>
    </div>
    <div class="container mt-3">
        <form #form="ngForm" class="d-flex mb-2" (ngSubmit)="loadMembers()">
            <div class="d-flex mx-2">
                <label class="col-form-label"> Age From:</label>
                <input type="number" class="form-control ms-1" name="minAge"
                    [(ngModel)]="this.memberservice.userParams().minAge">
            </div>

            <div class="d-flex mx-2">
                <label class="col-form-label"> Age to:</label>
                <input type="number" class="form-control ms-1" name="maxAge"
                    [(ngModel)]="this.memberservice.userParams().maxAge">
            </div>

            <div class="d-flex mx-2">
                <label class="col-form-label"> Show:</label>
                <select name="gender" class="form-select ms-1" style="width: 130px;"
                    [(ngModel)]="this.memberservice.userParams().gender">
                    @for (gender of genderList; track gender.value) {
                    <option [value]="gender.value">
                        {{gender.display}}
                    </option>
                    }
                </select>
            </div>

            <button class="btn btn-primary ms-1 " type="submit">Apply filters</button>
            <button (click)="resetFilters()" class="btn btn-info ms-1 mr-2" type="button">Reset filters</button>

            <div class="col ml-1">
                <div class="btn-group float-end">
                    <button class="btn btn-primary" type="button" name="orderBy" (click)="loadMembers()"
                        btnRadio="lastActive" [(ngModel)]="this.memberservice.userParams().orderBy">
                        Last Active
                    </button>

                    <button class="btn btn-primary" type="button" name="orderBy" (click)="loadMembers()"
                        btnRadio="created" [(ngModel)]="this.memberservice.userParams().orderBy">
                        Newest Members
                    </button>

                </div>
            </div>
        </form>
    </div>
    @for (member of memberservice.paginationResult()?.items; track member.id) {
    <div class="col-2">
        <app-member-cards [member]="member"></app-member-cards>
    </div>
    }
    @if (memberservice.paginationResult()?.pagination) {
    <div class="d-flex justify-content-center">
        <pagination [boundaryLinks]="true" [totalItems]="memberservice.paginationResult()?.pagination!.totalItems"
            [itemsPerPage]="memberservice.paginationResult()?.pagination!.itemsPerPage" [maxSize]="10"
            (pageChanged)="pageChanged($event)" [(ngModel)]="memberservice.paginationResult()?.pagination!.currentPage">
        </pagination>

    </div>

    }


</div>
